<div class="modal fade"
     id="databaseCredentialsModal"
     tabindex="-1"
     aria-labelledby="databaseCredentialsModalLabel"
     aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content">

            <form id="databaseCredentialsForm"
                  method="POST">

                <div class="modal-header">

                    <h5 class="modal-title" id="databaseCredentialsModalLabel">
                        <i class="bi bi-plug me-2"></i>
                        Database Authentication
                    </h5>

                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="modal"
                            aria-label="Close">
                    </button>

                </div>

                <div class="modal-body">

                    <p>
                        Enter the credentials for
                        <strong id="databaseConnectionName"></strong>
                    </p>

                    <!-- SQL authentication credentials -->
                    <div id="sqlCredentials" class="d-none">

                        <div class="mb-3">

                            <label for="databaseUsername" class="form-label">
                                Username
                            </label>

                            <input type="text"
                                   class="form-control"
                                   id="databaseUsername"
                                   name="username"
                                   autocomplete="username"
                                   placeholder="Enter SQL Server username">

                        </div>

                        <div class="mb-3">

                            <label for="databasePassword" class="form-label">
                                Password
                            </label>

                            <input type="password"
                                   class="form-control"
                                   id="databasePassword"
                                   name="password"
                                   autocomplete="current-password"
                                   placeholder="Enter SQL Server password">

                        </div>

                    </div>

                    <!-- Windows authentication information -->
                    <div id="windowsCredentials" class="d-none">

                        <div class="alert alert-info mb-0">

                            <i class="bi bi-info-circle me-2"></i>

                            Windows Integrated Authentication will be used
                            with the application's configured Windows identity.

                        </div>

                    </div>

                    <div class="form-text mt-3">
                        Credentials are only used to test the connection
                        and are not saved in the application database.
                    </div>

                </div>

                <div class="modal-footer">

                    <button type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal">

                        Cancel

                    </button>

                    <button type="submit"
                            class="btn btn-primary"
                            id=""databaseCredentialsSubmit>
                        Continue
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>
